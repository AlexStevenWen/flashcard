/* =========================================================
   14. Excel 匯出 / 匯入
   ========================================================= */
function exportExcel(){
  if (!store.cards.length){ alert('目前沒有資料可以匯出'); return; }

  const cardHeader = [
    'id','正面','背面','備註','牌組',
    '視覺等級','視覺複習次數','視覺易度','視覺間隔(天)','視覺下次到期','視覺遺忘次數','視覺最後複習',
    '聽力等級','聽力複習次數','聽力易度','聽力間隔(天)','聽力下次到期','聽力遺忘次數','聽力最後複習',
    '建立時間'
  ];
  const cardRows = [cardHeader];
  store.cards.forEach(c => {
    const key = cardKey(c);
    const pV = getProgress(key, 'visual');
    const pL = getProgress(key, 'listen');
    const LV = pV && pV.level ? LV_MAP[pV.level] : null;
    const LL = pL && pL.level ? LV_MAP[pL.level] : null;
    cardRows.push([
      c.id, c.front, c.back, c.note || '', c.deck || '預設',
      LV ? LV.name : '',
      pV ? pV.reps : '',
      pV ? Number(pV.ease.toFixed(2)) : '',
      pV ? pV.interval : '',
      pV && pV.due ? formatDate(pV.due) : '',
      pV ? pV.lapses : '',
      pV && pV.last ? formatDate(pV.last) : '',
      LL ? LL.name : '',
      pL ? pL.reps : '',
      pL ? Number(pL.ease.toFixed(2)) : '',
      pL ? pL.interval : '',
      pL && pL.due ? formatDate(pL.due) : '',
      pL ? pL.lapses : '',
      pL && pL.last ? formatDate(pL.last) : '',
      formatDate(c.created || Date.now()),
    ]);
  });
  const wsCards = XLSX.utils.aoa_to_sheet(cardRows);
  wsCards['!cols'] = [
    { wch: 14 },{ wch: 24 },{ wch: 24 },{ wch: 22 },{ wch: 14 },
    { wch: 10 },{ wch: 12 },{ wch: 10 },{ wch: 12 },{ wch: 18 },{ wch: 12 },{ wch: 18 },
    { wch: 10 },{ wch: 12 },{ wch: 10 },{ wch: 12 },{ wch: 18 },{ wch: 12 },{ wch: 18 },
    { wch: 18 },
  ];

  const logHeader = ['時間','正面','背面','評分','實際等級','模式'];
  const logRows = [logHeader];
  const cardByKey = new Map(store.cards.map(c => [cardKey(c), c]));
  store.logs.slice(-10000).forEach(l => {
    const c = cardByKey.get(l.key || l.id);
    const L = LV_MAP[l.lv];
    const E = LV_MAP[l.eff];
    logRows.push([
      formatDate(l.t),
      c ? c.front : '', c ? c.back : '',
      L ? L.name : (l.lv || ''),
      E ? E.name : (l.eff || ''),
      l.mode === 'visual' ? '視覺' : l.mode === 'listen' ? '聽力' : (l.mode || ''),
    ]);
  });
  const wsLogs = XLSX.utils.aoa_to_sheet(logRows);
  wsLogs['!cols'] = [{ wch: 18 },{ wch: 24 },{ wch: 24 },{ wch: 10 },{ wch: 10 },{ wch: 10 }];

  const today = dateKey();
  const vLogs = store.logs.filter(l => l.mode === 'visual');
  const lLogs = store.logs.filter(l => l.mode === 'listen');
  const tV = vLogs.filter(l => dateKey(new Date(l.t)) === today);
  const tL = lLogs.filter(l => dateKey(new Date(l.t)) === today);
  const acc = arr => arr.length ? Math.round(arr.filter(l => l.lv >= 3).length / arr.length * 100) + '%' : '—';

  const statsRows = [
    ['項目','數值'],
    ['匯出時間', formatDate(Date.now())],
    ['總卡片數', store.cards.length],
    ['', ''],
    ['模式','視覺','聽力'],
    ['累計複習次數', vLogs.length, lLogs.length],
    ['累計記得率', acc(vLogs), acc(lLogs)],
    ['今日複習次數', tV.length, tL.length],
    ['今日記得率', acc(tV), acc(tL)],
    ['', ''],
    ['等級','視覺張數','聽力張數'],
    ...LEVELS.slice().reverse().map(L => [
      L.name,
      store.cards.filter(c => getLevel(cardKey(c), 'visual') === L.lv).length,
      store.cards.filter(c => getLevel(cardKey(c), 'listen') === L.lv).length,
    ]),
    ['未學習',
      store.cards.filter(c => !hasProgress(cardKey(c), 'visual')).length,
      store.cards.filter(c => !hasProgress(cardKey(c), 'listen')).length,
    ],
  ];
  const wsStats = XLSX.utils.aoa_to_sheet(statsRows);
  wsStats['!cols'] = [{ wch: 16 },{ wch: 16 },{ wch: 16 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsCards, 'Cards');
  XLSX.utils.book_append_sheet(wb, wsLogs, 'Logs');
  XLSX.utils.book_append_sheet(wb, wsStats, '統計');
  XLSX.writeFile(wb, `字卡備份_${dateKey()}.xlsx`);
}

function downloadTemplate(){
  const ws = XLSX.utils.aoa_to_sheet([
    ['正面','背面','備註','牌組'],
    ['apple', '蘋果', '水果', '單字'],
    ['book',  '書本', '',     '單字'],
    ['run',   '跑',   '動詞', '單字'],
  ]);
  ws['!cols'] = [{ wch: 18 },{ wch: 18 },{ wch: 18 },{ wch: 12 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '字卡');
  XLSX.writeFile(wb, '字卡範本.xlsx');
}

function importExcel(file){
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array', cellDates:true });

      let cardSheetName = null;
      if (wb.Sheets['Cards']) cardSheetName = 'Cards';
      else {
        for (const name of wb.SheetNames){
          const probe = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, blankrows:false, defval:'' });
          if (!probe.length) continue;
          const head = probe[0].map(x => String(x).trim().toLowerCase());
          const hasF = head.some(h => FRONT_KEYS.some(k => h.includes(k)));
          const hasB = head.some(h => BACK_KEYS.some(k => h.includes(k)));
          if (hasF && hasB){ cardSheetName = name; break; }
        }
      }
      if (!cardSheetName){ alert('找不到可辨識的卡片工作表'); return; }

      const rows = XLSX.utils.sheet_to_json(wb.Sheets[cardSheetName], { header:1, blankrows:false, defval:'' });
      if (rows.length < 2){ alert('工作表沒有資料列'); return; }

      const head = rows[0].map(x => String(x).trim());
      const findIdx = (keys) => head.findIndex(h => {
        const s = h.toLowerCase();
        return keys.some(k => s.includes(k.toLowerCase()));
      });
      const idx = {
        id:       head.findIndex(h => h.toLowerCase() === 'id'),
        front:    findIdx(FRONT_KEYS),
        back:     findIdx(BACK_KEYS),
        note:     findIdx(NOTE_KEYS),
        deck:     head.findIndex(h => h.includes('牌組') || h.toLowerCase().includes('deck')),
        vLevel:   head.findIndex(h => h.includes('視覺等級')),
        vReps:    head.findIndex(h => h.includes('視覺複習次數')),
        vEase:    head.findIndex(h => h.includes('視覺易度')),
        vInterval:head.findIndex(h => h.includes('視覺間隔')),
        vDue:     head.findIndex(h => h.includes('視覺下次到期')),
        vLapses:  head.findIndex(h => h.includes('視覺遺忘')),
        vLast:    head.findIndex(h => h.includes('視覺最後')),
        lLevel:   head.findIndex(h => h.includes('聽力等級')),
        lReps:    head.findIndex(h => h.includes('聽力複習次數')),
        lEase:    head.findIndex(h => h.includes('聽力易度')),
        lInterval:head.findIndex(h => h.includes('聽力間隔')),
        lDue:     head.findIndex(h => h.includes('聽力下次到期')),
        lLapses:  head.findIndex(h => h.includes('聽力遺忘')),
        lLast:    head.findIndex(h => h.includes('聽力最後')),
        legacyLevel: head.findIndex(h => (h === '等級' || h === '等级' || h.toLowerCase() === 'level')),
      };

      if (idx.front < 0 || idx.back < 0){ alert('工作表需包含「正面」與「背面」欄位'); return; }

      const hasDual = idx.vLevel >= 0 || idx.lLevel >= 0;
      const hasLegacy = idx.legacyLevel >= 0;

      let merge = false;
      if (store.cards.length){
        merge = confirm(`目前已有 ${store.cards.length} 張卡片。\n\n按「確定」＝合併\n按「取消」＝覆蓋`);
      }

      if (!merge){
        store.cards = [];
        store.progress = { visual:{}, listen:{} };
        store.logs = [];
      }

      const byKey = new Map(store.cards.map(c => [cardKey(c), c]));

      let added = 0, updated = 0, skipped = 0;

      for (let i = 1; i < rows.length; i++){
        const r = rows[i] || [];
        const front = String(r[idx.front] ?? '').trim();
        const back  = String(r[idx.back]  ?? '').trim();
        if (!front && !back) continue;

        const key = front + SEP + back;
        let card = byKey.get(key);

        if (card){
          if (idx.note >= 0) card.note = String(r[idx.note] ?? '').trim();
          if (idx.deck >= 0){
            const d = String(r[idx.deck] ?? '').trim();
            if (d) card.deck = d;
          }
          updated++;
        } else {
          if (!front || !back){ skipped++; continue; }
          card = {
            id: idx.id >= 0 ? String(r[idx.id] ?? '').trim() || uid() : uid(),
            front, back,
            note: idx.note >= 0 ? String(r[idx.note] ?? '').trim() : '',
            deck: idx.deck >= 0 ? (String(r[idx.deck] ?? '').trim() || '預設') : '預設',
            created: Date.now(),
          };
          store.cards.push(card);
          byKey.set(key, card);
          added++;
        }

        if (hasDual){
          if (idx.vLevel >= 0){
            const lv = parseLevel(r[idx.vLevel]);
            if (lv > 0){
              const p = getProgress(key, 'visual') || newProgress();
              p.level = lv;
              if (idx.vReps >= 0)     p.reps     = Number(r[idx.vReps])     || 0;
              if (idx.vEase >= 0)     p.ease     = Number(r[idx.vEase])     || 2.5;
              if (idx.vInterval >= 0) p.interval = Number(r[idx.vInterval]) || 0;
              if (idx.vLapses >= 0)   p.lapses   = Number(r[idx.vLapses])   || 0;
              if (idx.vLast >= 0)     p.last     = parseDate(r[idx.vLast])  || Date.now();
              if (idx.vDue >= 0)      p.due      = parseDate(r[idx.vDue])   || (Date.now() + p.interval * 86400000);
              if (!Array.isArray(p.history)) p.history = [];
              setProgress(key, 'visual', p);
            }
          }
          if (idx.lLevel >= 0){
            const lv = parseLevel(r[idx.lLevel]);
            if (lv > 0){
              const p = getProgress(key, 'listen') || newProgress();
              p.level = lv;
              if (idx.lReps >= 0)     p.reps     = Number(r[idx.lReps])     || 0;
              if (idx.lEase >= 0)     p.ease     = Number(r[idx.lEase])     || 2.5;
              if (idx.lInterval >= 0) p.interval = Number(r[idx.lInterval]) || 0;
              if (idx.lLapses >= 0)   p.lapses   = Number(r[idx.lLapses])   || 0;
              if (idx.lLast >= 0)     p.last     = parseDate(r[idx.lLast])  || Date.now();
              if (idx.lDue >= 0)      p.due      = parseDate(r[idx.lDue])   || (Date.now() + p.interval * 86400000);
              if (!Array.isArray(p.history)) p.history = [];
              setProgress(key, 'listen', p);
            }
          }
        } else if (hasLegacy){
          const lv = parseLevel(r[idx.legacyLevel]);
          if (lv > 0){
            const base = newProgress();
            base.level = lv;
            setProgress(key, 'visual', JSON.parse(JSON.stringify(base)));
            setProgress(key, 'listen', JSON.parse(JSON.stringify(base)));
          }
        }
      }

      // 匯入後，全部標 dirty
      markAllShardsDirty();
      logDirty = true;

      save();
      scheduleUpload();
      session = null;
      render();

      alert(
        `匯入完成！\n新增 ${added} 張・更新 ${updated} 張` +
        (skipped ? `・略過 ${skipped} 張` : '') +
        (hasDual ? `\n（含視覺與聽力兩套進度）` : hasLegacy ? `\n（舊格式進度，複製到兩個模式）` : '')
      );
    } catch(err){
      console.error(err);
      alert('匯入失敗：' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

/* =========================================================
   15. 事件綁定與啟動
   ========================================================= */
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  const tab = b.dataset.tab;
  if (session && ((tab !== 'visual' && session.mode === 'visual') ||
                  (tab !== 'listen' && session.mode === 'listen'))){
    if (!confirm('確定要離開本次學習嗎？進度已自動儲存。')) return;
    session = null;
  }
  currentTab = tab;
  render();
});

document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  if (!session || session.idx >= session.queue.length) return;
  if (e.code === 'Space'){ e.preventDefault(); flipCard(); }
  else if (['1','2','3','4','5'].includes(e.key)){ e.preventDefault(); doGrade(Number(e.key)); }
});

window.addEventListener('beforeunload', flushUpload);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushUpload();
});

(async () => {
  const cleaned = extractFolderId(store.settings.folderId);
  if (cleaned && cleaned !== store.settings.folderId){
    store.settings.folderId = cleaned;
    save();
  }

  migrateProgressKeys();

  render();

  if (cloudReady() && store.settings.autoSync){
    await syncFromCloud(true);
  }
})();
</script>
</body>
